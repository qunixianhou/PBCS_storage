<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文件加密与认证系统</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 800px; }
        .container { margin-bottom: 20px; }
        button { padding: 8px 15px; margin: 5px; cursor: pointer; }
        input[type="text"], input[type="password"] { padding: 5px; margin: 5px; width: 200px; }
        #result, #decryptedContent, #backendLogs { margin-top: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .error { color: red; }
        .success { color: green; }
        #userList, #decryptedContent, #backendLogs { margin-top: 10px; }
        #decryptedContent, #backendLogs { white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
        #backendWindow { display: none; position: fixed; top: 50px; right: 20px; width: 400px; height: 500px; background: white; border: 1px solid #ccc; padding: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        #backendWindow h3 { margin: 0 0 10px 0; }
        #closeBackendBtn { float: right; }
        #imagePreview { margin-top: 15px; max-width: 100%; display: none; } /* 新增样式 */
    </style>
</head>
<body>
<h2>文件加密与认证系统</h2>

<div class="container">
    <h3>用户认证</h3>
    <input type="text" id="userId" placeholder="用户ID">
    <input type="password" id="passphrase" placeholder="密码">
    <button id="authBtn">认证</button>
    <button id="showBackendBtn">显示后台</button>
</div>

<div class="container">
    <h3>已注册用户</h3>
    <button id="checkUsersBtn">查询已注册用户</button>
    <div id="userList"></div>
</div>

<div class="container">
    <h3>上传并加密文件</h3>
    <input type="file" id="fileInput" accept="image/*,.txt"> <!-- 支持图片和文本 -->
    <button id="uploadBtn">上传</button>
</div>

<div class="container">
    <h3>查看加密文件</h3>
    <button id="viewBtn">查看加密内容</button>
    <button id="viewDecryptedBtn">查看解密内容</button>
</div>

<div id="result"></div>
<div id="decryptedContent"></div>
<img id="imagePreview" alt="解密后的图片预览"> <!-- 新增图片预览元素 -->

<div id="backendWindow">
    <h3>后台日志 <button id="closeBackendBtn">关闭</button></h3>
    <div id="backendLogs"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
